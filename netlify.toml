# Netlify build for MyCato.
# Required environment variable (Site settings → Environment variables):
#   GITHUB_TOKEN — fine-grained token with read-only "Contents" access to
#                  aulitech/z_cato, used by netlify/functions/releases.ts

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
