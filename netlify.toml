# Netlify build for MyCato (the Vite app lives in MyCato/).
# Required environment variable (Site settings → Environment variables):
#   GITHUB_TOKEN — fine-grained token with read-only "Contents" access to
#                  aulitech/z_cato, used by MyCato/netlify/functions/releases.ts

[build]
  base = "MyCato"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
